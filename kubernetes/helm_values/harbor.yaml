# Harbor is published through the Gateway in the network namespace, which terminates TLS
# with the certificate cert-manager issues for it. The chart therefore only creates the
# HTTPRoute attaching to that Gateway and serves plain HTTP inside the cluster.
expose:
  type: route
  tls:
    enabled: false
  route:
    hosts:
      - ${harbor_domain}
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: ${gateway_name}
        namespace: ${gateway_namespace}
        sectionName: ${gateway_section_name}
externalURL: ${harbor_url}
persistence:
  persistentVolumeClaim:
    registry:
      size: 200Gi
    jobservice:
      jobLog:
        size: 5Gi
    database:
      size: 5Gi
    redis:
      size: 5Gi
    trivy:
      size: 5Gi
existingSecretAdminPassword: "harbor-admin"
imagePullSecrets:
  - name: docker-registry-secret
