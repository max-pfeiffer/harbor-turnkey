# The certificate the HTTPS listener serves. It is issued through the ACME HTTP-01
# challenge, which is solved on the HTTP listener of the very same Gateway, so the
# listener stays unready until the certificate has been issued for the first time.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  dnsNames:
    - {{ .Values.gateway.httpsListener.hostname | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.certificate.clusterIssuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
