clusterIssuer:
  # name of the ClusterIssuer that Ingress resources refer to.
  name: "step-ca"
  # acmeDirectoryUrl is the ACME directory of the step-ca ACME provisioner.
  acmeDirectoryUrl: ""
  # caBundle is the base64 encoded root CA certificate, used to verify the TLS
  # certificate step-ca serves its ACME endpoint with.
  caBundle: ""
  # solverIngressName is the name of an existing Ingress that ACME HTTP-01 challenge
  # routes are inserted into. Cilium runs its ingress controller in dedicated load
  # balancer mode, so every Ingress gets its own IP address. A solver Ingress of its own
  # would therefore be published under a different IP address than the domain resolves
  # to, and the challenge could never be validated.
  solverIngressName: ""
